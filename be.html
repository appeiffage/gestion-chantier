<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bureau d'Études - Stade Gabriel-Montpied</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-200 text-slate-800 min-h-screen">

  <!-- BANDEAU HAUT -->
  <header class="relative bg-[#0b172a] text-white overflow-hidden shadow-xl border-b-4 border-purple-500">
    <div class="absolute right-0 bottom-0 top-0 w-full md:w-3/4 pointer-events-none opacity-30 flex items-end justify-end">
      <svg viewBox="0 0 1000 320" class="w-full h-full object-cover" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0 310 L 450 310 Q 750 310 1000 295" stroke="#334155" stroke-width="2"/>
        <path d="M 30 75 Q 400 95 940 255" stroke="#a855f7" stroke-width="2.5" opacity="0.6"/>
        <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
          <line x1="45" y1="310" x2="35" y2="70"/><line x1="100" y1="310" x2="40" y2="70"/>
          <line x1="125" y1="310" x2="135" y2="73"/><line x1="140" y1="310" x2="225" y2="78"/>
          <line x1="205" y1="310" x2="225" y2="78"/><line x1="225" y1="310" x2="225" y2="78"/>
          <line x1="245" y1="310" x2="315" y2="84"/><line x1="300" y1="310" x2="315" y2="84"/>
          <line x1="315" y1="310" x2="315" y2="84"/><line x1="330" y1="310" x2="405" y2="92"/>
          <line x1="390" y1="310" x2="405" y2="92"/><line x1="405" y1="310" x2="405" y2="92"/>
          <line x1="420" y1="310" x2="495" y2="105"/><line x1="480" y1="310" x2="495" y2="105"/>
          <line x1="510" y1="310" x2="580" y2="125"/><line x1="565" y1="310" x2="580" y2="125"/>
          <line x1="590" y1="310" x2="665" y2="150"/><line x1="650" y1="310" x2="665" y2="150"/>
          <line x1="680" y1="310" x2="745" y2="180"/><line x1="730" y1="310" x2="745" y2="180"/>
          <line x1="755" y1="305" x2="815" y2="210"/><line x1="805" y1="305" x2="815" y2="210"/>
          <line x1="830" y1="300" x2="880" y2="238"/><line x1="870" y1="300" x2="880" y2="238"/>
          <line x1="895" y1="298" x2="935" y2="260"/><line x1="930" y1="295" x2="935" y2="260"/>
        </g>
        <path d="M 40 72 L 135 75 L 225 80 L 315 86 L 405 94 L 495 107 L 580 127 L 665 152 L 745 182 L 815 212 L 880 240 L 935 262" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4"/>
        <path d="M 25 70 Q 400 85 945 265" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        <path d="M 25 65 Q 400 80 945 260" stroke="#c084fc" stroke-width="2" opacity="0.9"/>
      </svg>
    </div>

    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 py-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div class="flex items-center space-x-4">
        <div class="bg-purple-600 text-white w-13 h-13 p-3 rounded-2xl flex items-center justify-center font-black text-2xl shadow-lg shrink-0">
          <i class="fa-solid fa-compass-drafting"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-black text-xl md:text-2xl tracking-tight text-white drop-shadow">Stade Gabriel-Montpied</h1>
            <span class="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-400/50 px-2 py-0.5 rounded-full font-bold">Bureau d'Études</span>
          </div>
          <p class="text-sm text-slate-300 font-medium mt-0.5">
            Suivi des études & visas techniques — <span id="date-du-jour" class="capitalize"></span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 flex-wrap">
        <a href="plans.html?role=be" class="bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-black px-3.5 py-2.5 rounded-xl shadow flex items-center gap-2 transition active:scale-95">
          <i class="fa-solid fa-map-location-dot"></i>
          <span>Plans d'implantation</span>
        </a>
        <button onclick="ouvrirModalAjoutTache()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl shadow flex items-center gap-2 transition active:scale-95">
          <i class="fa-solid fa-plus-circle"></i>
          <span>Créer une tâche technique</span>
        </button>
        <button onclick="ouvrirModalHistorique()" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-600 text-slate-200 text-xs font-bold px-3.5 py-2.5 rounded-xl shadow flex items-center gap-2 transition active:scale-95">
          <i class="fa-solid fa-rotate-left text-amber-400"></i>
          <span>Historique & Rétablir</span>
        </button>
      </div>
    </div>

    <div class="relative border-t border-white/10 bg-slate-950/60 backdrop-blur-md px-4 sm:px-6 py-2">
      <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar">
        <span class="text-xs font-black text-purple-300 uppercase tracking-wider shrink-0 mr-1"><i class="fa-solid fa-layer-group mr-1"></i> Zone :</span>
        <button onclick="filtrerZone('Toutes')" class="zone-btn active px-3 py-1 rounded-xl text-xs font-black shrink-0 bg-purple-500 text-white shadow">Toutes zones</button>
        <button onclick="filtrerZone('RDC')" class="zone-btn px-3 py-1 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">RDC</button>
        <button onclick="filtrerZone('N1')" class="zone-btn px-3 py-1 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">N1</button>
        <button onclick="filtrerZone('N2')" class="zone-btn px-3 py-1 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">N2</button>
        <button onclick="filtrerZone('N3')" class="zone-btn px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">N3</button>
        <button onclick="filtrerZone('N4')" class="zone-btn px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">N4</button>
        <button onclick="filtrerZone('N5')" class="zone-btn px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">N5</button>
        <button onclick="filtrerZone('Billetterie')" class="zone-btn px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">Billetterie</button>
        <button onclick="filtrerZone('Gymnase')" class="zone-btn px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">Gymnase</button>
        <button onclick="filtrerZone('Gergovie')" class="zone-btn px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">Gergovie</button>
      </div>
    </div>

    <div class="relative border-t border-white/5 bg-slate-950/80 px-4 sm:px-6 py-2">
      <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar">
        <span class="text-xs font-black text-amber-400 uppercase tracking-wider shrink-0 mr-1"><i class="fa-solid fa-users-gear mr-1"></i> Rôle :</span>
        <button onclick="filtrerRole('BE')" class="role-btn active px-3.5 py-1 rounded-xl text-xs font-black shrink-0 bg-purple-600 text-white shadow">
          <i class="fa-solid fa-compass-drafting mr-1"></i> BE uniquement
        </button>
        <button onclick="filtrerRole('Chantier')" class="role-btn px-3.5 py-1 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">
          <i class="fa-solid fa-helmet-safety mr-1"></i> Chantier
        </button>
        <button onclick="filtrerRole('RA')" class="role-btn px-3.5 py-1 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">
          <i class="fa-solid fa-briefcase mr-1"></i> RA
        </button>
        <button onclick="filtrerRole('Tous')" class="role-btn px-3.5 py-1 rounded-xl text-xs font-bold shrink-0 bg-slate-800 text-slate-200 hover:bg-slate-700">
          Toutes les tâches
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <section id="bloc-actions-be" class="bg-purple-100/80 border-2 border-purple-300 rounded-3xl p-5 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="bg-purple-600 text-white font-black text-xs px-2.5 py-1 rounded-xl uppercase tracking-wider flex items-center gap-1 shadow-sm">
            <i class="fa-solid fa-triangle-exclamation"></i> Actions requises BE
          </span>
          <h2 class="text-xs font-black text-purple-950 uppercase tracking-wide">Points d'arrêt & validations en attente du bureau d'études</h2>
        </div>
        <span id="badge-actions-be" class="text-xs font-black bg-purple-300 text-purple-950 px-2.5 py-0.5 rounded-full">0</span>
      </div>
      <div id="liste-actions-be" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <p class="text-xs text-purple-900/70 italic col-span-2">Aucun point bloquant attribué au BE actuellement.</p>
      </div>
    </section>

    <section class="space-y-4">
      <div class="bg-emerald-50/60 border border-emerald-200 rounded-3xl p-4 md:p-5 shadow-sm space-y-3">
        <div class="flex items-center justify-between pb-1 border-b border-emerald-200">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <h3 class="text-xs font-black uppercase tracking-wider text-emerald-950">Tâches planifiées</h3>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-bold text-emerald-900/70">Total actives :</span>
            <span id="count-total-taches" class="text-xs font-black bg-emerald-600 text-white px-2.5 py-0.5 rounded-lg shadow-sm">0</span>
          </div>
        </div>
        <div id="liste-taches-datees" class="space-y-3">
          <p class="text-xs text-slate
